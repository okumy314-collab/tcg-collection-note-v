name: update-card-data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Pokémon card data
        run: node fetch-poke.mjs

      - name: Update Japanese One Piece card data
        run: node scripts/fetch-op.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poke.json data/op.json
          git diff --cached --quiet || git commit -m "Update Pokémon and One Piece card data"
          git push
