name: validate-one-piece-data

on:
  pull_request:
    paths:
      - "scripts/fetch-op.mjs"
      - ".github/workflows/update-data.yml"
      - ".github/workflows/validate-one-piece-data.yml"
      - "index.html"
      - "data/ygo-oac.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check updater syntax
        run: node --check scripts/fetch-op.mjs

      - name: Check app script syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [];
          let cursor = 0;
          while (true) {
            const open = html.indexOf('<script', cursor);
            if (open < 0) break;
            const contentStart = html.indexOf('>', open);
            const close = html.indexOf('</script>', contentStart + 1);
            if (contentStart < 0 || close < 0) throw new Error('scriptタグの閉じ方が不正です');
            scripts.push(html.slice(contentStart + 1, close));
            cursor = close + '</script>'.length;
          }
          if (!scripts.length) throw new Error('index.html のスクリプトが見つかりません');
          writeFileSync('/tmp/tcg-app-check.js', scripts.join('\n'));
          NODE
          node --check /tmp/tcg-app-check.js

      - name: Generate Japanese One Piece card data
        run: node scripts/fetch-op.mjs

      - name: Validate generated data
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('data/op.json', 'utf8'));
          if (!Array.isArray(data.cards) || data.cards.length < 200) {
            throw new Error('カードデータが空、または件数不足です');
          }
          const card = data.cards.find(x => x[0] === 'OP01-001');
          if (!card || card[1] !== 'ロロノア・ゾロ') {
            throw new Error('日本語カード名の検証に失敗しました');
          }
          if (!card[3].startsWith('https://www.onepiece-cardgame.com/images/cardlist/card/')) {
            throw new Error('公式カード画像URLの検証に失敗しました');
          }
          if (!data.cards.every(x => x.length === 7 && x[0] && x[1] && x[2] && x[3])) {
            throw new Error('データ項目の形式が不正です');
          }
          console.log('検証成功:', data.cards.length, '件');
          console.log('サンプル:', card[0], card[1], card[2]);
          NODE

      - name: Validate Yu-Gi-Oh ORIGINAL ARTWORK COLLECTION data
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('data/ygo-oac.json', 'utf8'));
          if (!Array.isArray(data.cards) || data.knownCards !== data.cards.length) {
            throw new Error('遊戯王データの件数と配列が一致しません');
          }
          if (data.totalCardTypes !== 100 || data.knownCards > data.totalCardTypes) {
            throw new Error('遊戯王データの全種類数が不正です');
          }
          if (!['partial_verified', 'verified_full_list'].includes(data.datasetStatus)) {
            throw new Error('データ状態が明示されていません');
          }
          const ids = new Set();
          const cardNumbers = new Set();
          for (const card of data.cards) {
            if (!card.id || !card.name || !Array.isArray(card.variants) || !card.variants.length) {
              throw new Error('カード情報の必須項目が不足しています');
            }
            if (ids.has(card.id)) throw new Error('カードIDが重複しています: ' + card.id);
            ids.add(card.id);
            if (card.cardNumber && !/^YAC1-JP\d{3}$/.test(card.cardNumber)) {
              throw new Error('カード番号の形式が不正です: ' + card.cardNumber);
            }
            if (card.cardNumber && cardNumbers.has(card.cardNumber)) {
              throw new Error('カード番号が重複しています: ' + card.cardNumber);
            }
            if (card.cardNumber) cardNumbers.add(card.cardNumber);
            if (card.verified !== true) {
              throw new Error('未確認カードが確認済みデータに混在しています: ' + card.id);
            }
          }
          for (const number of ['YAC1-JP004', 'YAC1-JP009']) {
            if (!data.cards.some(card => card.cardNumber === number)) {
              throw new Error('確認済みカード番号が見つかりません: ' + number);
            }
          }
          console.log('遊戯王データ検証成功:', data.knownCards, '/', data.totalCardTypes, '件。状態:', data.datasetStatus);
          NODE
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('data/ygo-oac.json', 'utf8'));
          if (!Array.isArray(data.cards) || data.knownCards !== data.cards.length) {
            throw new Error('遊戯王データの件数と配列が一致しません');
          }
          if (data.totalCardTypes !== 100 || data.knownCards > data.totalCardTypes) {
            throw new Error('遊戯王データの全種類数が不正です');
          }
          const ids = new Set();
          for (const card of data.cards) {
            if (!card.id || !card.name || !Array.isArray(card.variants) || !card.variants.length) {
              throw new Error('カード情報の必須項目が不足しています');
            }
            if (ids.has(card.id)) throw new Error('カードIDが重複しています: ' + card.id);
            ids.add(card.id);
          }
          for (const number of ['YAC1-JP004', 'YAC1-JP009']) {
            if (!data.cards.some(card => card.cardNumber === number)) {
              throw new Error('確認済みカード番号が見つかりません: ' + number);
            }
          }
          console.log('遊戯王データ検証成功:', data.knownCards, '/', data.totalCardTypes, '件（部分収録）');
          NODE
