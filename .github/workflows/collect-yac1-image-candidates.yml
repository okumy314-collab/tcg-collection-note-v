name: Collect YAC1 image candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/japanese-one-piece-card-data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Extract review-only image candidates
        run: python scripts/collect-ygo-image-candidates.py
      - name: Commit candidate metadata when changed
        run: |
          if git diff --quiet -- data/ygo-oac.json; then
            echo "No new image candidates were found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ygo-oac.json
          git commit -m "Collect review-only YAC1 image candidates"
          git push origin HEAD:feature/japanese-one-piece-card-data
