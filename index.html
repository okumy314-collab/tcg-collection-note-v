<style>

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--bd);z-index:5}

.sh .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.sh .hd b{font-size:18px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-120px);background:var(--up);color:#04130c;padding:12px 18px;border-radius:14px;font-weight:800;z-index:30;transition:.35s;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0)}.toast u{cursor:pointer;font-weight:800}
.empty{text-align:center;color:var(--mu);padding:30px 10px;font-size:14px;line-height:1.8}
svg text{fill:var(--mu);font-size:10px}
body{font-size:14px;line-height:1.45}main{padding:6px 14px}.card{padding:14px 16px;margin-bottom:10px}h3{margin:16px 4px 8px}label{margin:12px 0 5px}
.chip{white-space:nowrap;padding:7px 13px;font-size:12.5px}.btn{white-space:nowrap}.btn.sm{padding:9px 4px;font-size:11px;overflow:hidden;text-overflow:ellipsis}.row>.btn.p{font-size:11.5px;padding:13px 4px}
.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row>div[style*="text-align:right"]{white-space:nowrap}.th{flex:none!important;width:56px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.g[style]{flex-wrap:wrap}.g .r[style]{margin-left:0!important;width:100%}.g .r[style] .btn{flex:1}
.gl{flex:1;min-width:0}.gl .n{font-size:12px;color:var(--mu)}.gv{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}.gp{font-size:12px}.gr{text-align:right;font-size:11px;color:var(--mu);line-height:1.7;white-space:nowrap}.gr b{font-size:14px;color:var(--tx)}
</style></head><body>

<button class="tb" data-v="coll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V8"/></svg>マイコレ</button>

<script>
const GN0={
poke:{n:'ポケカ',c:'#facc15',sr:['スカーレット&バイオレット','ソード&シールド','サン&ムーン','拡張パック(その他)','プロモ'],rr:['C','U','R','RR','RRR','SR','HR','UR','AR','SAR','BWR'],s:[['カードラッシュ','https://www.cardrush-pokemon.jp/product-list?keyword='],['遊々亭','https://yuyu-tei.jp/sell/poc/s/search?search_word=']]},
ygo:{n:'遊戯王',c:'#f97316',sr:['QUARTER CENTURY','レアリティ・コレクション','パック(その他)','構築済みデッキ','プロモ'],rr:['N','R','SR','UR','UL','SE','PSE','QCSE','KC'],s:[['遊々亭','https://yuyu-tei.jp/sell/ygo/s/search?search_word='],['メルカリ','https://jp.mercari.com/search?keyword=']]},
mtg:{n:'MTG',c:'#38bdf8',sr:['スタンダード最新','モダンホライゾン','統率者','レガシー/旧セット','プロモ'],rr:['C','U','R','M','ショーケース','拡張アート','FOIL'],s:[['晴れる屋','https://www.hareruya2.com/products?query='],['メルカリ','https://jp.mercari.com/search?keyword=']]},
op:{n:'ワンピース',c:'#f43f5e',sr:['ブースターパック','エクストラブースター','スタートデッキ','プロモ'],rr:['C','UC','R','SR','SEC','L','SP','P'],s:[['遊々亭','https://yuyu-tei.jp/sell/opc/s/search?search_word='],['メルカリ','https://jp.mercari.com/search?keyword=']]},
dm:{n:'デュエマ',c:'#a78bfa',sr:['拡張パック','スーパーデッキ','プロモ'],rr:['C','U','R','VR','SR','MWR','OR','P'],s:[['遊々亭','https://yuyu-tei.jp/sell/dm/s/search?search_word='],['メルカリ','https://jp.mercari.com/search?keyword=']]},
ws:{n:'ヴァイス',c:'#34d399',sr:['ブースターパック','トライアルデッキ','プロモ'],rr:['C','U','R','RR','RRR','SR','SSP','SP'],s:[['遊々亭','https://yuyu-tei.jp/sell/ws/s/search?search_word='],['メルカリ','https://jp.mercari.com/search?keyword=']]}
};
const R='カードラッシュ',Y='遊々亭',V='駿河屋',gg=n=>'https://www.google.com/search?q='+encodeURIComponent(n+' '),yy=c=>'https://yuyu-tei.jp/sell/'+c+'/s/search?search_word=';
const GN={
poke:{n:'ポケモン',c:'#facc15',o:'https://www.pokemon-card.com/card-search/index.php?keyword=',sr:['MEGAシリーズ','スカーレット&バイオレット','ソード&シールド','サン&ムーン','XY以前','プロモ'],rr:['C','U','R','RR','RRR','SR','HR','UR','AR','SAR','ACE','MUR','BWR'],s:[[R,'https://www.cardrush-pokemon.jp/product-list?keyword='],[Y,yy('poc')],[V,gg(V)]]},
op:{n:'ワンピース',c:'#f43f5e',o:'https://www.onepiece-cardgame.com/cardlist/?freewords=',sr:['ブースターパック','エクストラブースター','プレミアムブースター','スタートデッキ','プロモ'],rr:['C','UC','R','SR','SEC','L','SP','P'],s:[[R,'https://www.cardrush-op.jp/product-list?keyword='],[Y,yy('opc')],[V,gg(V)]]},
ygo:{n:'遊戯王',c:'#f97316',o:'https://www.db.yugioh-card.com/yugiohdb/card_search.action?ope=1&keyword=',sr:['QUARTER CENTURY','レアリティ・コレクション','パック(その他)','構築済みデッキ','プロモ'],rr:['N','R','SR','UR','UL','SE','PSE','QCSE','KC'],s:[[R,gg(R+' 遊戯王')],[Y,yy('ygo')],[V,gg(V)]]},
rush:{n:'ラッシュデュエル',c:'#38bdf8',sr:['ブースター','デッキ','プロモ'],rr:['N','R','SR','UR','GR','SE'],s:[[R,gg(R+' ラッシュデュエル')],[Y,gg(Y+' ラッシュデュエル')],[V,gg(V+' ラッシュデュエル')]]},
digi:{n:'デジモン',c:'#a78bfa',sr:['ブースター','エクストラ','スタートデッキ','プロモ'],rr:['C','U','R','SR','SEC','P'],s:[[R,gg(R+' デジモンカード')],[Y,gg(Y+' デジモンカード')],[V,gg(V+' デジモンカード')]]},
ua:{n:'ユニアリ',c:'#34d399',sr:['ブースター','スタートデッキ','プロモ'],rr:['C','U','R','SR','UR','P'],s:[[R,gg(R+' ユニオンアリーナ')],[Y,gg(Y+' ユニオンアリーナ')],[V,gg(V+' ユニオンアリーナ')]]}
};
const $=s=>document.querySelector(s),yen=n=>'¥'+Math.round(n).toLocaleString(),K='tcg-note-v1';
let S={cards:[],hist:[]},view='home',cur='all',F={g:'poke',q:1},mg='poke';
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{snap();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('⚠ 保存容量がいっぱいです。バックアップを取って、写真を減らしてください')}};
const cost=c=>(c.paid??c.base)*c.qty,val=c=>c.price*c.qty;
const tot=a=>({q:a.reduce((x,c)=>x+c.qty,0),k:a.length,v:a.reduce((x,c)=>x+val(c),0),c:a.reduce((x,c)=>x+cost(c),0)});
function snap(){const d=new Date().toISOString().slice(0,10),v=tot(S.cards).v,l=S.hist[S.hist.length-1];if(l&&l.d===d)l.v=v;else S.hist.push({d,v})}
const pl=(v,c)=>{const d=v-c,p=c?d/c*100:0;return `<span class="${d>=0?'up':'dn'}">${d>=0?'+':''}${yen(d)} (${d>=0?'+':''}${p.toFixed(1)}%)</span>`};
const u=(g,i)=>GN[g].s[i][1];const link=(g,c,i)=>u(g,i)+encodeURIComponent(((c.name||'')+' '+(c.no||'')).trim());
function chart(){
 const h=S.hist.slice(-30);if(h.length<2)return `<div class="empty">データが貯まるとここに推移グラフが表示されます</div>`;
 const W=320,H=130,P=6,mx=Math.max(...h.map(x=>x.v)),mn=Math.min(...h.map(x=>x.v)),r=(mx-mn)||1;
 const pt=h.map((x,i)=>[P+i*(W-2*P)/(h.length-1),H-18-(x.v-mn)/r*(H-40)]);
 const d=pt.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs><path d="${d}L${pt[pt.length-1][0]} ${H-18}L${P} ${H-18}Z" fill="url(#gr)"/><path d="${d}" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${pt[pt.length-1][0]}" cy="${pt[pt.length-1][1]}" r="4" fill="#22d3ee"/><text x="${P}" y="${H-3}">${h[0].d.slice(5)}</text><text x="${W-P}" y="${H-3}" text-anchor="end">${h[h.length-1].d.slice(5)}</text><text x="${P}" y="10">${yen(mx)}</text></svg>`}
function home(){
 const t=tot(S.cards);
 let h=`<div class="card hero"><div class="l">総資産評価額</div><div class="v">${yen(t.v)}</div><span class="pill">${t.v-t.c>=0?'▲':'▼'} ${yen(Math.abs(t.v-t.c))} (${t.c?((t.v-t.c)/t.c*100).toFixed(1):'0.0'}%)</span><div class="l" style="margin-top:8px">取得額 ${yen(t.c)}</div></div>
 <div class="grid"><div class="card stat"><div class="l">所持枚数</div><div class="v">${t.q.toLocaleString()}<small> 枚</small></div></div><div class="card stat"><div class="l">カード種類</div><div class="v">${t.k.toLocaleString()}<small> 種</small></div></div></div>
 <div class="card"><div class="l" style="font-size:12px;color:var(--mu);font-weight:700;margin-bottom:6px">資産推移</div>${chart()}</div><h3>タイトル別</h3>`;
 const gs=['poke','op','ygo'];
 h+=gs.map(g=>{const a=tot(S.cards.filter(c=>c.g===g));return `<div class="card g" onclick="cur='${g}';go('coll')"><div class="dot" style="background:${GN[g].c}"></div><div class="gl"><div class="n">${GN[g].n}</div><div class="gv">${yen(a.v)}</div><div class="gp">${pl(a.v,a.c)}</div></div><div class="gr"><b>${a.q}</b>枚<br><b>${a.k}</b>種</div></div>`}).join('');
 if(!S.cards.length)h+=`<div class="card empty">右下の ＋ から最初の1枚を登録しましょう</div>`;

function coll(){
 const gs=Object.keys(GN);let h=`<div class="chips"><button class="chip ${cur=='all'?'on':''}" onclick="cur='all';render()">すべて</button>${gs.map(g=>`<button class="chip ${cur==g?'on':''}" onclick="cur='${g}';render()">${GN[g].n}</button>`).join('')}</div>`;
 const a=S.cards.filter(c=>cur=='all'||c.g==cur).sort(SORT[so]),t=tot(a);
 h+=`<div class="card g" style="cursor:default"><div class="gl"><div class="n">資産価値</div><div class="gv">${yen(t.v)}</div><div class="gp">${pl(t.v,t.c)}</div></div><div class="gr"><b>${t.q}</b>枚<br><b>${t.k}</b>種</div></div>`;
 h+=sortbar();if(!a.length)return h+`<div class="empty">このジャンルのカードはまだありません</div>`;
 return h+a.map(c=>`<div class="card it"><div class="row">${c.img?`<img src="${c.img}" class="th" onclick="pvw(this.src)">`:''}<div><div class="t">${c.name}</div><div class="m"><span class="tag" style="color:${GN[c.g].c}">${GN[c.g].n}</span>${c.pack||c.series||''} ${c.rarity?'・'+c.rarity:''} ${c.no?'・'+c.no:''}</div>${(c.place||c.cond||c.paid!=null||c.memo)?`<div class="m">📝 ${[c.place,c.cond,c.paid!=null?'取得 '+yen(c.paid):'',c.memo].filter(Boolean).join(' / ')}</div>`:''}</div><div style="flex:none;text-align:right"><b style="font-size:17px">${yen(val(c))}</b><div class="m">${c.qty}枚 × 平均${yen(c.price)}</div><div style="font-size:12px">${pl(val(c),cost(c))}</div></div></div>
 <div class="row">${GN[c.g].s.map((s,i)=>`<div><div class="m" style="margin:0 0 3px;font-size:11px">${s[0]}</div><input type="number" inputmode="numeric" value="${pr3(c)[i]||''}" placeholder="¥" style="padding:8px;${best(c,i)}" onchange="upd('${c.id}',${i},+this.value)"></div>`).join('')}</div>
 <div class="row">${GN[c.g].s.map((s,i)=>`<a class="btn sm" target="_blank" rel="noopener" href="${link(c.g,c,i)}">${s[0]}</a>`).join('')}</div><div class="row"><button class="btn sm" onclick="detail('${c.id}')">詳細登録</button></div></div>`).join('')}
function mk(){

function candOP(){
 const b=$('#cd');if(!b)return;
 const q=$('#fn').value.trim(),seq=++OPSEARCH;
 if(!q){OPR=[];b.innerHTML='<div style="font-size:11px;color:var(--mu);margin-top:6px">カード名を入力すると候補が表示されます。</div>';return}
 if(!OP_READY){b.innerHTML='<div style="font-size:11px;color:var(--mu);margin-top:6px">ワンピースのカードデータを読み込み中…</div>';return}
 const norm=s=>String(s||'').normalize('NFKC').toLocaleLowerCase().replace(/[\s　・]/g,'');
 const nq=norm(q);
 OPR=OPI.filter(x=>norm(x.n).includes(nq)).sort((a,b)=>(norm(a.n)===nq?0:1)-(norm(b.n)===nq?0:1)||a.no.localeCompare(b.no,'ja')).slice(0,50);
 if(seq!==OPSEARCH)return;

 if(OP_ERROR)b.innerHTML+='<div style="font-size:11px;color:var(--mu);margin-top:6px">保存済みデータを読み込めません。データ更新後に再試行してください。</div>';
}

function pickOP(i){
 const x=OPR[i];if(!x)return;
 const b=$('#cd');$('#fn').value=x.n;$('#fo').value=x.no;F.r=x.rarity;F.img=x.img||'';
 const ss=$('#fs');
 // Preserve the exact Japanese pack title from the master data, including newer sets

 if(x.packName){ss.value=SO;$('#fs2').style.display='block';$('#fs2').value=x.packName}
 else {const series=opSeries(x.no),option=[...ss.options].find(o=>o.text.trim()===series);if(option){ss.value=option.value;$('#fs2').style.display='none'}}
 const rr=$('#rr');if(rr){rr.querySelectorAll('.chip').forEach(el=>el.classList.remove('on'));let found=false;rr.querySelectorAll('.chip').forEach(el=>{if(el.textContent.trim()===x.rarity){el.classList.add('on');found=true}});if(!found){const chip=document.createElement('button');chip.className='chip on';chip.textContent=x.rarity;chip.onclick=()=>{F.r=chip.textContent;rr.querySelectorAll('.chip').forEach(el=>el.classList.toggle('on',el===chip))};rr.appendChild(chip)}}

}
function cand(){
 const b=$('#cd');if(!b)return;
 const q=$('#fn').value.trim();
 const rawNo=$('#fo').value.trim();
 const seq=++PKSEARCH;
 // Never reuse a previous card number to filter a new name search.
 if(q && q!==PKLASTNAME){PKLASTNAME=q;}
 if(F.g==='op'){candOP();return}
 if(F.g==='ygo'){
  const normYgo=v=>String(v||'').normalize('NFKC').toLocaleLowerCase().replace(/[\\s　・]/g,'');
  const nq=normYgo(q);
  const rows=YGOI.filter(x=>normYgo(x.name).includes(nq)).slice(0,50).map(x=>({n:x.name,l:x.cardNumber,cardNo:x.cardNumber,rarity:x.baseRarity,setName:'ORIGINAL ARTWORK COLLECTION',setId:'',img:'',verifiedNameAndNumber:x.verifiedNameAndNumber}));
  PKR=rows;
  b.innerHTML=rows.length?renderPKR(rows):'<div style="font-size:11px;color:var(--mu);margin-top:6px">候補を読み込み中、または一致するカードがありません。少し待って再入力してください。</div>';
  return;
}
if(F.g!=='poke'){b.innerHTML='';return}
 if(!q){PKR=[];b.innerHTML='<div style="font-size:11px;color:var(--mu);margin-top:6px">カード名を入力すると候補が表示されます。番号だけの検索は候補が混ざりやすいため、カード名から検索してください。</div>';return}
 b.innerHTML='<div style="font-size:11px;color:var(--mu);margin-top:6px">カード名を検索中…</div>';
 const norm=s=>String(s||'').normalize('NFKC').toLocaleLowerCase().replace(/[\s　・]/g,'');
 const nq=norm(q);
 const local=PKI.filter(x=>norm(x.n).includes(nq)).map(x=>({...x,local:true,setName:x.s?.n||'',setSeries:x.s?.r||''}));
 fetch('https://api.tcgdex.net/v2/ja/cards?name='+encodeURIComponent(q)).then(r=>{if(!r.ok)throw Error('API '+r.status);return r.json()}).then(rows=>{
  if(seq!==PKSEARCH||!$('#cd'))return;
  if(!Array.isArray(rows))throw Error('unexpected response');
  const mapped=rows.map(d=>({n:d.name||'',l:String(d.localId||''),img:d.image?d.image+'/low.webp':'',live:true,setId:d.id||'',setName:d.set?.name||'',setSeries:d.set?.serie?.name||''}));
  // Remove unrelated fuzzy matches; exact/substring matches only, with name similarity first.
  const all=[...mapped,...local].filter(x=>norm(x.n).includes(nq));
  const seen=new Set();
  PKR=all.filter(x=>{const k=(x.setId||x.s?.id||'')+'|'+x.l+'|'+norm(x.n);if(seen.has(k))return false;seen.add(k);return true})
    .sort((a,b)=>(norm(a.n)===nq?0:1)-(norm(b.n)===nq?0:1)||a.n.localeCompare(b.n,'ja')).slice(0,50);
  b.innerHTML=PKR.length?renderPKR(PKR):'<div style="font-size:11px;color:var(--mu);margin-top:6px">一致する候補がありません。名前を短くするか、カード名を確認してください。</div>';
 }).catch(()=>{
  if(seq!==PKSEARCH||!$('#cd'))return;
  const seen=new Set();PKR=local.filter(x=>{const k=(x.s?.id||'')+'|'+x.l+'|'+norm(x.n);if(seen.has(k))return false;seen.add(k);return true}).slice(0,50);
  b.innerHTML=PKR.length?renderPKR(PKR)+'<div style="font-size:11px;color:var(--mu);margin-top:6px">オンライン検索に接続できないため、保存済みデータのみ表示しています。</div>':'<div style="font-size:11px;color:var(--mu);margin-top:6px">検索に接続できません。時間をおいて再試行するか、カード情報を手入力してください。</div>';
 });
}
function renderPKR(rows){return `<div class="card" style="padding:4px;margin:8px 0 0;max-height:300px;overflow:auto">${rows.map((x,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--bd);cursor:pointer" onclick="pickc(${i})">${cimg(x)?`<img class="th" style="width:36px;height:50px" src="${cimg(x)}" onerror="this.style.display='none'" loading="lazy">`:''}<div style="min-width:0"><div style="font-weight:700;font-size:13px">${x.n}</div><div style="font-size:11px;color:var(--mu)">${x.l}${x.setName?' ・ '+x.setName:''}</div></div></div>`).join('')}</div>`}
async function pickc(i){
 const x=PKR[i];if(!x)return;
 const b=$('#cd');const selectedName=x.n;
 // Clear stale fields first so a missing value from this card cannot inherit the last card's value.
 $('#fn').value=selectedName;$('#fo').value='';F.r='';F.img='';
 const rr=$('#rr');if(rr)rr.querySelectorAll('.chip').forEach(el=>el.classList.remove('on'));

 let detail=x;
 if(x.setId){
  b.innerHTML='<div style="font-size:11px;color:var(--mu);margin-top:6px">選択したカードの詳細を確認中…</div>';
  try{
   const r=await fetch('https://api.tcgdex.net/v2/ja/cards/'+encodeURIComponent(x.setId));
   if(r.ok){const d=await r.json();detail={...x,...d,n:d.name||x.n,l:String(d.localId??x.l),img:d.image?d.image+'/low.webp':x.img,setName:d.set?.name||x.setName||'',setSeries:d.set?.serie?.name||x.setSeries||'',rarity:d.rarity||''};
    const count=d.set?.cardCount?.official||d.set?.cardCount?.total;
    detail.cardNo=String(d.localId??x.l)+(count?'/'+count:'');
   }
  }catch(e){/* Keep selected card data, never reuse another card's number or rarity. */}
 }
 $('#fn').value=detail.n||selectedName;
 $('#fo').value=detail.cardNo||String(detail.localId??detail.l??'');
 const sel=$('#fs');const setName=detail.setName||(detail.s&&detail.s.n)||'';
 const option=[...sel.options].find(o=>o.text.trim()===setName||o.text.includes(setName));
 if(option){sel.value=option.value;$('#fs2').style.display='none'}else if(setName){sel.value=SO;$('#fs2').style.display='block';$('#fs2').value=setName}
 if(detail.rarity){F.r=detail.rarity;if(rr){let found=false;rr.querySelectorAll('.chip').forEach(el=>{const on=el.textContent.trim()===F.r;el.classList.toggle('on',on);if(on)found=true});if(!found){const chip=document.createElement('button');chip.className='chip on';chip.textContent=F.r;chip.onclick=()=>{F.r=chip.textContent;rr.querySelectorAll('.chip').forEach(el=>el.classList.toggle('on',el===chip))};rr.appendChild(chip)}}}
 F.img=detail.img||cimg(detail)||'';
 if(p&&F.img){p.src=F.img;p.style.display='block'}
 b.innerHTML=`<div style="font-size:11px;color:var(--up);margin-top:6px">✓ 選択済み${setName?' ・ '+setName:''}${detail.rarity?' ・ '+detail.rarity:' ・ レアリティ情報なし'} ・ ${$('#fo').value||'カード番号情報なし'}</div>`;
}
